<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Status</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style3.css') }}">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <img src="{{ url_for('static', filename='nlc.jpg') }}" alt="Logo" class="logo">
            <h1 class="title">Tender Document Evaluation Utility</h1>
        </div>
    </header>

    <!-- Main Section -->
    <main class="hero-center">
        <div class="hero-content">
            <h1>Workflow Status</h1>

            <!-- Status Area -->
            <div id="statusArea" class="status-message warning">
                <p>⚠️ Workflow not started yet.</p>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button id="startBtn" class="btn btn--primary">Start Evaluation</button>
                <button id="udyamBtn" class="btn btn--secondary">Udyam Verification</button>
            </div>

            <!-- Back Link -->
            <a href="{{ url_for('merge_page') }}" class="back-link">← Back</a>

        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        const startBtn = document.getElementById("startBtn");
        const udyamBtn = document.getElementById("udyamBtn");
        const statusArea = document.getElementById("statusArea");

        // Common Timer Function
        function startTimer() {
            let seconds = 0;
            const timerElement = document.getElementById("timer");

            const interval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerElement.textContent = `${mins}:${secs}`;
            }, 1000);

            return interval;
        }

        // Start Evaluation Workflow
        startBtn.addEventListener("click", async () => {

            startBtn.disabled = true;
            startBtn.textContent = "Running...";

            statusArea.className = "status-message warning";
            statusArea.innerHTML = `
                <p><span class="rotate">⏳</span> Evaluation started... Please wait.</p>
                <p>Elapsed Time: <span id="timer">00:00</span></p>
            `;

            const interval = startTimer();

            try {
                const response = await fetch("http://localhost:5678/webhook/93f97adb-c532-44d9-9942-da74472c8cb6", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ files: {{ files|tojson }} })
                });

                clearInterval(interval);
                const timeTaken = document.getElementById("timer").textContent;

                if (response.ok) {
                    statusArea.className = "status-message success";
                    statusArea.innerHTML = `
                        <p>✅ Evaluation Completed Successfully!</p>
                        <p class="time-info">Time taken: ${timeTaken}</p>
                        <p>Redirecting to report...</p>
                    `;

                    setTimeout(() => {
                        window.location.href =
                            "https://docs.google.com/spreadsheets/d/1wkYCypcvEWqS1Uz-zOfoIpR9gdNjDoktTm50jc-eTL0/edit?usp=sharing";
                    }, 5000);

                } else {
                    statusArea.className = "status-message warning";
                    statusArea.innerHTML = `
                        <p>⚠️ Evaluation failed. Check console.</p>
                        <p class="time-info">Time taken: ${timeTaken}</p>
                    `;
                }

            } catch (error) {
                clearInterval(interval);
                statusArea.className = "status-message warning";
                statusArea.innerHTML = `
                    <p>❌ Error: Unable to reach server.</p>
                    <p class="time-info">Check your connection.</p>
                `;
            }

            startBtn.disabled = false;
            startBtn.textContent = "Start Evaluation";
        });

        // Udyam Verification Workflow
        udyamBtn.addEventListener("click", async () => {

            udyamBtn.disabled = true;
            udyamBtn.textContent = "Running...";

            statusArea.className = "status-message warning";
            statusArea.innerHTML = `
                <p><span class="rotate">⏳</span> Udyam Verification started... Please wait.</p>
                <p>Elapsed Time: <span id="timer">00:00</span></p>
            `;

            const interval = startTimer();

            try {
                const response = await fetch("http://localhost:5678/webhook/YOUR_UDYAM_WEBHOOK_ID", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ files: {{ files|tojson }} })
                });

                clearInterval(interval);
                const timeTaken = document.getElementById("timer").textContent;

                if (response.ok) {
                    statusArea.className = "status-message success";
                    statusArea.innerHTML = `
                        <p>✅ Udyam Verification Completed!</p>
                        <p class="time-info">Time taken: ${timeTaken}</p>
                    `;
                } else {
                    statusArea.className = "status-message warning";
                    statusArea.innerHTML = `
                        <p>⚠️ Udyam process failed. Check console.</p>
                        <p class="time-info">Time taken: ${timeTaken}</p>
                    `;
                }

            } catch (error) {
                clearInterval(interval);
                statusArea.className = "status-message warning";
                statusArea.innerHTML = `
                    <p>❌ Error: Unable to reach Udyam server.</p>
                    <p class="time-info">Check your connection.</p>
                `;
            }

            udyamBtn.disabled = false;
            udyamBtn.textContent = "Udyam Verification";
        });

    </script>

</body>
</html>
