version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=false
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - TESSERACT_PATH=/usr/bin/tesseract
      - CHROME_DRIVER_PATH=/usr/bin/chromedriver
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/merged:/app/merged
      - ./backend/reports:/app/reports
      - ./backend/data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
